<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>TODO</title>
    <script src="js/jquery-2.1.3.min.js"></script>
    <link rel="stylesheet" href="css/sample.css">
</head>
<style>
    body {
        font-family: sans-serif;
        max-width: 400px;
        margin: 40px auto;

    }

    /* ダークモード */
    body.dark {
        background: #222;
        color: #eee;
    }

    body.dark li {
        border-color: #555;
    }

    input {
        width: 70%;
        padding: 8px;
        margin-bottom: 12px;
    }

    button {
        padding: 8px 12px;
        margin-bottom: 12px;
    }

    ul {
        list-style: none;
        padding: 0;
    }

    li {
        padding: 6px 0;
        display: flex;
        justify-content: space-between;
        border-bottom: 1px solid #ddd;
    }

    /* 完了タスクの線 */
    .done {
        text-decoration: line-through;
        color: #888;
    }

    .todo-text {
        flex: 1;
        margin-left: 8px;
    }

    .date {
        font-size: 12px;
        color: #777;
        margin-left: 8px;
    }

    .dark .date {
        color: #aaa;
    }

    input[type="checkbox"] {
        width: 16px;
        height: 16px;
        transform: scale(1);
        /* もとの大きさにする */
        margin-right: 8px;
    }
</style>
</head>

<body>

    <h1>TODO</h1>

    <input id="todoInput" placeholder="やることを入力…" />
    <button id="addBtn">追加</button>
    <button id="themeBtn">🌙 ダークモード</button>

    <ul id="todoList"></ul>

    <script>
        const input = document.getElementById("todoInput");
        const addBtn = document.getElementById("addBtn");
        const todoList = document.getElementById("todoList"); // DOM取得

        let todos = JSON.parse(localStorage.getItem("todos")) || []; // 保存されているTODOを読み込む
        let theme = localStorage.getItem("theme") || "light";


        if (theme === "dark") {
            document.body.classList.add("dark");
            themeBtn.textContent = "☀️ ライトモード"; // ページ読み込み時の初期設定
        }

        render(); // ページ読み込み時にTODOを表示

        // 追加ボタンを押したとき
        addBtn.addEventListener("click", () => {
            const text = input.value.trim();
            if (text === "") return;

            const now = new Date();
            const dateStr = `${now.getFullYear()}/${now.getMonth() + 1}/${now.getDate()}`;

            todos.push({                  //配列に追加
                text,
                done: false,
                date: dateStr
            });

            saveTodos();                   // localStorageへ保存
            render();                      // 表示更新
            input.value = "";              // 入力欄をクリア
        });

        // TODOを画面に表示する
        function render() {
            todoList.innerHTML = "";       // 一度リセット

            todos.forEach((todo, index) => {
                const li = document.createElement("li");

                const checkbox = document.createElement("input"); // チェックボックス
                checkbox.type = "checkbox";
                checkbox.checked = todo.done;

                checkbox.addEventListener("change", () => {
                    todos[index].done = checkbox.checked;
                    saveTodos();
                    render();
                });

                const span = document.createElement("span");   // テキスト
                span.textContent = todo.text;
                span.className = "todo-text";
                if (todo.done) span.classList.add("done");

                const dateSpan = document.createElement("span"); // 日付
                dateSpan.textContent = `(${todo.date})`;
                dateSpan.className = "date";

                const delBtn = document.createElement("button"); // 削除ボタン
                delBtn.textContent = "削除";
                delBtn.addEventListener("click", () => {
                    todos.splice(index, 1);    // 配列から削除
                    saveTodos();               // 保存
                    render();                  // 再表示
                });

                li.appendChild(checkbox);
                li.appendChild(span);
                li.appendChild(delBtn);
                li.appendChild(dateSpan);
                todoList.appendChild(li);
            });
        }

        // localStorageに保存する
        function saveTodos() {
            localStorage.setItem("todos", JSON.stringify(todos));
        }

        // ダークモード切り替え
        themeBtn.addEventListener("click", () => {
            document.body.classList.toggle("dark");

            theme = document.body.classList.contains("dark") ? "dark" : "light";
            localStorage.setItem("theme", theme);

            themeBtn.textContent =
                theme === "dark" ? "☀️ ライトモード" : "🌙 ダークモード";
        });

    </script>
</body>

</html>
